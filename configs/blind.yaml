# E1 blind-baseline configuration: same model as baseline.yaml, but images
# are replaced by zeros (or shuffled) to test whether the model actually
# uses the image. See Project Brief, section 8 (E1).
seed: 42
d_model: 128
n_heads: 4
n_layers: 2
batch_size: 64
learning_rate: 0.001
epochs: 15
data_path: "data"
blind_baseline: true